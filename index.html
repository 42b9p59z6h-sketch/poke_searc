<!DOCTYPE html>
<html lang="ja" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PokéValuate - ポケカリアルタイム相場 & マイ資産ポートフォリオ</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- FontAwesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Chart.js CDN -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        brand: {
                            dark: '#0b0f19',
                            card: '#151c2c',
                            border: '#2a364f',
                            cyan: '#00f2fe',
                            emerald: '#10b981',
                            purple: '#a855f7',
                            gold: '#f59e0b'
                        }
                    }
                }
            }
        }
    </script>
    <style>
        body {
            background-color: #0b0f19;
            color: #f3f4f6;
            font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        }
        .glass-panel {
            background: rgba(21, 28, 44, 0.75);
            backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.08);
        }
        .neon-glow-cyan {
            box-shadow: 0 0 20px rgba(0, 242, 254, 0.18);
        }
        .neon-glow-gold {
            box-shadow: 0 0 20px rgba(245, 158, 11, 0.25);
        }
    </style>
</head>
<body class="min-h-screen pb-16">

    <!-- ヘッダー -->
    <header class="sticky top-0 z-40 glass-panel border-b border-brand-border px-4 py-3 mb-6">
        <div class="max-w-7xl mx-auto flex flex-col md:flex-row items-center justify-between gap-4">
            <div class="flex items-center space-x-3">
                <div class="w-10 h-10 rounded-xl bg-gradient-to-br from-brand-cyan via-brand-purple to-brand-gold flex items-center justify-center font-black text-xl text-slate-950 shadow-lg">
                    P
                </div>
                <div>
                    <h1 class="font-bold text-lg leading-tight bg-gradient-to-r from-brand-cyan via-white to-brand-gold bg-clip-text text-transparent">
                        PokéValuate
                    </h1>
                    <p class="text-xs text-slate-400">ポケカ相場検索 ＆ マイ資産ポートフォリオ</p>
                </div>
            </div>

            <!-- タブ切り替え -->
            <div class="flex bg-slate-900/90 p-1 rounded-xl border border-brand-border">
                <button id="tab-all" onclick="switchTab('all')" class="px-5 py-2 rounded-lg text-sm font-bold transition-all duration-200 bg-brand-cyan text-slate-950 shadow">
                    <i class="fa-solid fa-magnifying-glass mr-1.5"></i>相場検索
                </button>
                <button id="tab-pinned" onclick="switchTab('pinned')" class="px-5 py-2 rounded-lg text-sm font-bold text-slate-400 hover:text-white transition-all duration-200 flex items-center gap-2">
                    <i class="fa-solid fa-thumbtack text-brand-gold"></i>
                    マイ資産 (ピン留め)
                    <span id="pinned-count-badge" class="bg-brand-gold/20 text-brand-gold px-2 py-0.5 rounded-full text-xs font-extrabold border border-brand-gold/40">0</span>
                </button>
            </div>
        </div>
    </header>

    <main class="max-w-7xl mx-auto px-4">

        <!-- ピン留めカードの自動計算＆グラフサマリーボード -->
        <section class="glass-panel rounded-2xl p-6 mb-8 border border-brand-border neon-glow-cyan relative overflow-hidden">
            <div class="grid grid-cols-1 lg:grid-cols-3 gap-6 items-center">
                
                <!-- 左側: 数字サマリー -->
                <div class="lg:col-span-2 space-y-4">
                    <div class="flex items-center gap-2 text-xs font-bold text-brand-cyan tracking-wider uppercase">
                        <i class="fa-solid fa-chart-line"></i> ピン留めコレクション推定評価額
                    </div>
                    
                    <div class="flex flex-wrap items-baseline gap-3">
                        <span class="text-xs text-slate-400">最低合計:</span>
                        <span id="total-min-val" class="text-2xl md:text-4xl font-extrabold text-white">¥0</span>
                        <span class="text-slate-500 font-bold">〜</span>
                        <span class="text-xs text-slate-400">最高合計:</span>
                        <span id="total-max-val" class="text-2xl md:text-4xl font-extrabold bg-gradient-to-r from-brand-gold to-yellow-200 bg-clip-text text-transparent">¥0</span>
                    </div>
                    
                    <p class="text-xs text-slate-400">※ 最低相場（買取・フリマ最安基準）〜 最高相場（ショップ販売・PSA10上限基準）の合計試算</p>

                    <div class="flex flex-wrap gap-4 pt-2">
                        <div class="bg-slate-900/80 border border-brand-border px-4 py-2.5 rounded-xl min-w-[130px]">
                            <div class="text-[11px] text-slate-400 mb-0.5">ピン留め種類</div>
                            <div id="summary-card-types" class="text-lg font-bold text-slate-200">0 種</div>
                        </div>
                        <div class="bg-slate-900/80 border border-brand-border px-4 py-2.5 rounded-xl min-w-[130px]">
                            <div class="text-[11px] text-slate-400 mb-0.5">総所有枚数</div>
                            <div id="summary-total-qty" class="text-lg font-bold text-brand-cyan">0 枚</div>
                        </div>
                        <div class="bg-slate-900/80 border border-brand-border px-4 py-2.5 rounded-xl min-w-[130px]">
                            <div class="text-[11px] text-slate-400 mb-0.5">最高額保持カード</div>
                            <div id="summary-top-card" class="text-xs font-bold text-brand-gold truncate max-w-[120px]">-</div>
                        </div>
                    </div>
                </div>

                <!-- 右側: Chart.js ドーナツグラフ -->
                <div class="flex flex-col items-center justify-center border-t lg:border-t-0 lg:border-l border-brand-border pt-4 lg:pt-0 lg:pl-6">
                    <div class="text-xs font-semibold text-slate-400 mb-2">資産構成比 (レアリティ別)</div>
                    <div class="w-44 h-44 relative">
                        <canvas id="portfolioChart"></canvas>
                    </div>
                </div>

            </div>
        </section>

        <!-- 検索バーとフィルター制御 -->
        <section class="flex flex-col sm:flex-row gap-3 mb-6">
            <div class="relative flex-1">
                <i class="fa-solid fa-magnifying-glass absolute left-4 top-1/2 -translate-y-1/2 text-slate-400"></i>
                <input type="text" id="search-input" oninput="renderCards()" placeholder="カード名、パック名、レアリティ（例: リザードン, SAR, PSA10, プロモ）で検索..." 
                    class="w-full bg-slate-900/90 border border-brand-border rounded-xl pl-11 pr-4 py-3 text-sm text-white placeholder-slate-500 focus:outline-none focus:border-brand-cyan transition">
            </div>
            <select id="sort-select" onchange="renderCards()" class="bg-slate-900/90 border border-brand-border rounded-xl px-4 py-3 text-sm text-slate-300 focus:outline-none focus:border-brand-cyan">
                <option value="max-desc">最高価格が高い順</option>
                <option value="min-desc">最低価格が高い順</option>
                <option value="trend-desc">高騰トレンド順</option>
                <option value="name-asc">カード名順</option>
            </select>
        </section>

        <!-- クイックフィルタータグ -->
        <section class="flex flex-wrap gap-2 mb-6" id="filter-tags">
            <button onclick="setFilterTag('all')" class="filter-tag active px-3 py-1 rounded-lg text-xs font-bold bg-brand-cyan text-slate-950">すべて</button>
            <button onclick="setFilterTag('高騰中')" class="filter-tag px-3 py-1 rounded-lg text-xs font-bold bg-slate-800 text-slate-400 hover:text-white">🔥 高騰中</button>
            <button onclick="setFilterTag('SAR')" class="filter-tag px-3 py-1 rounded-lg text-xs font-bold bg-slate-800 text-slate-400 hover:text-white">SAR</button>
            <button onclick="setFilterTag('PROMO')" class="filter-tag px-3 py-1 rounded-lg text-xs font-bold bg-slate-800 text-slate-400 hover:text-white">🎁 プロモ</button>
        </section>

        <!-- カード一覧グリッド -->
        <section id="card-grid" class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 xl:grid-cols-4 gap-5">
            <!-- JavaScriptで動的生成されます -->
        </section>

        <!-- 空状態メッセージ -->
        <div id="empty-state" class="hidden text-center py-16">
            <i class="fa-solid fa-box-open text-5xl text-slate-600 mb-3"></i>
            <p class="text-slate-400 text-sm" id="empty-msg">該当するカードが見つかりませんでした。</p>
        </div>

    </main>

    <!-- モーダル: 提携アフィリエイトリンク一覧 -->
    <div id="shop-modal" class="fixed inset-0 bg-slate-950/80 backdrop-blur-md hidden z-50 flex items-center justify-center p-4">
        <div class="glass-panel border border-brand-border rounded-2xl max-w-md w-full p-6 relative shadow-2xl">
            <button onclick="closeModal()" class="absolute right-4 top-4 text-slate-400 hover:text-white text-lg">
                <i class="fa-solid fa-xmark"></i>
            </button>
            <h3 id="modal-card-name" class="font-bold text-lg text-white mb-1">カード詳細</h3>
            <p id="modal-card-sub" class="text-xs text-brand-cyan mb-4">参考サイト・リアルタイム市場リンク</p>
            
            <p class="text-xs text-slate-400 mb-4">※ 以下のボタンから各トレカショップ・フリマの最安出品や現在の取扱在庫を確認できます。</p>

            <div id="modal-links" class="space-y-2.5">
                <!-- JavaScriptでリンクが動的に注入されます -->
            </div>
        </div>
    </div>

    <script>
        // ポケモンカードのサンプルデータベース
        const initialCardsData = [
            {
                id: "SV3-134",
                name: "リザードンex",
                rarity: "SAR",
                pack: "黒炎の支配者",
                rawMin: 18500,
                rawMax: 22000,
                psa10Min: 36000,
                psa10Max: 43000,
                trend: "+6.8%",
                isTrendUp: true,
                badge: "高騰中",
                img: "https://images.pokemontcg.io/sv3/134_hires.png"
            },
            {
                id: "SV2D-096",
                name: "ナンジャモ",
                rarity: "SAR",
                pack: "クレイバースト",
                rawMin: 52000,
                rawMax: 65000,
                psa10Min: 98000,
                psa10Max: 115000,
                trend: "-2.1%",
                isTrendUp: false,
                badge: "人気定番",
                img: "https://images.pokemontcg.io/sv2d/96_hires.png"
            },
            {
                id: "SM10b-054",
                name: "ファイヤー＆サンダー＆フリーザーGX",
                rarity: "SA",
                pack: "スカイレジェンド",
                rawMin: 14000,
                rawMax: 17500,
                psa10Min: 31000,
                psa10Max: 38000,
                trend: "+12.4%",
                isTrendUp: true,
                badge: "高騰中",
                img: "https://images.pokemontcg.io/sm10b/54_hires.png"
            },
            {
                id: "PROMO-227",
                name: "ピカチュウ (見返り美人)",
                rarity: "PROMO",
                pack: "切手BOXプロモ",
                rawMin: 23000,
                rawMax: 28000,
                psa10Min: 58000,
                psa10Max: 68000,
                trend: "+3.5%",
                isTrendUp: true,
                badge: "PROMO",
                img: "https://images.pokemontcg.io/swshp/227_hires.png"
            },
            {
                id: "SV4a-348",
                name: "ミュウex",
                rarity: "SAR",
                pack: "シャイニートレジャーex",
                rawMin: 7500,
                rawMax: 9800,
                psa10Min: 18000,
                psa10Max: 22000,
                trend: "+1.2%",
                isTrendUp: true,
                badge: "定番",
                img: "https://images.pokemontcg.io/sv4a/348_hires.png"
            },
            {
                id: "SM8b-150",
                name: "レックウザGX",
                rarity: "SSR",
                pack: "ウルトラシャイニー",
                rawMin: 8200,
                rawMax: 10500,
                psa10Min: 24000,
                psa10Max: 29000,
                trend: "+4.1%",
                isTrendUp: true,
                badge: "高騰中",
                img: "https://images.pokemontcg.io/sm8b/240_hires.png"
            }
        ];

        // アフィリエイトIDの設定
        const AFFILIATE_IDS = {
            rakuten: "YOUR_RAKUTEN_ID",
            amazon: "your-amazon-tag-22",
            mercari: "YOUR_MERCARI_AFID"
        };

        // アプリの状態管理
        let activeTab = 'all'; 
        let activeTagFilter = 'all';
        let pinnedItems = JSON.parse(localStorage.getItem('pokevaluate_pinned') || '{}'); 
        let chartInstance = null;

        // 初期化
        document.addEventListener('DOMContentLoaded', () => {
            initChart();
            renderCards();
            updateSummary();
        });

        // タブ切り替え
        function switchTab(tab) {
            activeTab = tab;
            const btnAll = document.getElementById('tab-all');
            const btnPinned = document.getElementById('tab-pinned');

            if (tab === 'all') {
                btnAll.className = "px-5 py-2 rounded-lg text-sm font-bold transition-all duration-200 bg-brand-cyan text-slate-950 shadow";
                btnPinned.className = "px-5 py-2 rounded-lg text-sm font-bold text-slate-400 hover:text-white transition-all duration-200 flex items-center gap-2";
            } else {
                btnPinned.className = "px-5 py-2 rounded-lg text-sm font-bold transition-all duration-200 bg-brand-gold text-slate-950 shadow flex items-center gap-2";
                btnAll.className = "px-5 py-2 rounded-lg text-sm font-bold text-slate-400 hover:text-white transition-all duration-200";
            }
            renderCards();
        }

        // フィルタータグ設定
        function setFilterTag(tag) {
            activeTagFilter = tag;
            const buttons = document.querySelectorAll('.filter-tag');
            buttons.forEach(btn => {
                if ((tag === 'all' && btn.textContent.includes('すべて')) || btn.textContent.includes(tag)) {
                    btn.className = "filter-tag active px-3 py-1 rounded-lg text-xs font-bold bg-brand-cyan text-slate-950";
                } else {
                    btn.className = "filter-tag px-3 py-1 rounded-lg text-xs font-bold bg-slate-800 text-slate-400 hover:text-white";
                }
            });
            renderCards();
        }

        // ピン留めのトグル
        function togglePin(cardId) {
            if (pinnedItems[cardId]) {
                delete pinnedItems[cardId];
            } else {
                pinnedItems[cardId] = { qty: 1 };
            }
            saveState();
            renderCards();
            updateSummary();
        }

        // 数量更新
        function updateQty(cardId, delta) {
            if (!pinnedItems[cardId]) return;
            const newQty = pinnedItems[cardId].qty + delta;
            if (newQty <= 0) {
                delete pinnedItems[cardId];
            } else {
                pinnedItems[cardId].qty = newQty;
            }
            saveState();
            renderCards();
            updateSummary();
        }

        function saveState() {
            localStorage.setItem('pokevaluate_pinned', JSON.stringify(pinnedItems));
        }

        // 集計計算 ＆ グラフ更新
        function updateSummary() {
            let totalMin = 0;
            let totalMax = 0;
            let totalQty = 0;
            let cardTypes = 0;
            let highestValCard = { name: '-', val: 0 };
            let rarityMap = {};

            initialCardsData.forEach(card => {
                if (pinnedItems[card.id]) {
                    const qty = pinnedItems[card.id].qty;
                    const cardMin = card.rawMin * qty;
                    const cardMax = card.psa10Max * qty;

                    totalMin += cardMin;
                    totalMax += cardMax;
                    totalQty += qty;
                    cardTypes++;

                    if (cardMax > highestValCard.val) {
                        highestValCard = { name: card.name, val: cardMax };
                    }

                    rarityMap[card.rarity] = (rarityMap[card.rarity] || 0) + cardMax;
                }
            });

            document.getElementById('total-min-val').textContent = `¥${totalMin.toLocaleString()}`;
            document.getElementById('total-max-val').textContent = `¥${totalMax.toLocaleString()}`;
            document.getElementById('summary-card-types').textContent = `${cardTypes} 種`;
            document.getElementById('summary-total-qty').textContent = `${totalQty} 枚`;
            document.getElementById('summary-top-card').textContent = highestValCard.name;
            document.getElementById('pinned-count-badge').textContent = cardTypes;

            updateChartData(rarityMap);
        }

        // Chart.js の初期化と更新
        function initChart() {
            const ctx = document.getElementById('portfolioChart').getContext('2d');
            chartInstance = new Chart(ctx, {
                type: 'doughnut',
                data: {
                    labels: ['データなし'],
                    datasets: [{
                        data: [1],
                        backgroundColor: ['#1e293b'],
                        borderWidth: 0
                    }]
                },
                options: {
                    responsive: true,
                    maintainAspectRatio: false,
                    plugins: {
                        legend: { display: false }
                    },
                    cutout: '70%'
                }
            });
        }

        function updateChartData(rarityMap) {
            if (!chartInstance) return;

            const labels = Object.keys(rarityMap);
            const data = Object.values(rarityMap);

            if (labels.length === 0) {
                chartInstance.data.labels = ['なし'];
                chartInstance.data.datasets[0].data = [1];
                chartInstance.data.datasets[0].backgroundColor = ['#1e293b'];
            } else {
                chartInstance.data.labels = labels;
                chartInstance.data.datasets[0].data = data;
                chartInstance.data.datasets[0].backgroundColor = [
                    '#00f2fe', '#f59e0b', '#a855f7', '#10b981', '#ec4899'
                ];
            }
            chartInstance.update();
        }

        // カード描画
        function renderCards() {
            const grid = document.getElementById('card-grid');
            const emptyState = document.getElementById('empty-state');
            const searchVal = document.getElementById('search-input').value.toLowerCase().trim();
            const sortVal = document.getElementById('sort-select').value;

            grid.innerHTML = '';

            let filtered = initialCardsData.filter(card => {
                if (activeTab === 'pinned' && !pinnedItems[card.id]) return false;
                
                if (activeTagFilter !== 'all') {
                    if (activeTagFilter === '高騰中' && !card.badge.includes('高騰中')) return false;
                    if (activeTagFilter === 'SAR' && card.rarity !== 'SAR') return false;
                    if (activeTagFilter === 'PROMO' && card.rarity !== 'PROMO') return false;
                }

                const matchSearch = card.name.toLowerCase().includes(searchVal) ||
                                    card.rarity.toLowerCase().includes(searchVal) ||
                                    card.pack.toLowerCase().includes(searchVal) ||
                                    card.id.toLowerCase().includes(searchVal);
                return matchSearch;
            });

            filtered.sort((a, b) => {
                if (sortVal === 'max-desc') return b.psa10Max - a.psa10Max;
                if (sortVal === 'min-desc') return b.rawMin - a.rawMin;
                if (sortVal === 'trend-desc') return parseFloat(b.trend) - parseFloat(a.trend);
                if (sortVal === 'name-asc') return a.name.localeCompare(b.name, 'ja');
                return 0;
            });

            if (filtered.length === 0) {
                emptyState.classList.remove('hidden');
                document.getElementById('empty-msg').textContent = activeTab === 'pinned' 
                    ? 'ピン留めされているカードがありません。「相場検索」タブから📌を押して追加してください。'
                    : '条件に一致するカードが見つかりませんでした。';
                return;
            } else {
                emptyState.classList.add('hidden');
            }

            filtered.forEach(card => {
                const isPinned = !!pinnedItems[card.id];
                const qty = isPinned ? pinnedItems[card.id].qty : 0;

                const cardEl = document.createElement('div');
                cardEl.className = `glass-panel rounded-2xl overflow-hidden border transition-all duration-300 flex flex-col justify-between ${
                    isPinned ? 'border-brand-gold/80 neon-glow-gold' : 'border-brand-border hover:border-slate-600'
                }`;

                cardEl.innerHTML = `
                    <div class="p-4">
                        <div class="flex justify-between items-start gap-2 mb-3">
                            <div>
                                <span class="inline-block bg-slate-800 text-brand-cyan text-[10px] font-extrabold px-2 py-0.5 rounded border border-brand-cyan/30">
                                    ${card.rarity}
                                </span>
                                <span class="text-xs text-slate-400 ml-1.5">${card.id}</span>
                                <h3 class="font-bold text-white text-base leading-tight mt-1">${card.name}</h3>
                                <p class="text-xs text-slate-400">${card.pack}</p>
                            </div>
                            <button onclick="togglePin('${card.id}')" 
                                class="w-9 h-9 rounded-xl flex items-center justify-center transition-all ${
                                    isPinned 
                                    ? 'bg-brand-gold text-slate-950 font-bold shadow-lg scale-105' 
                                    : 'bg-slate-800/80 text-slate-400 hover:text-white hover:bg-slate-700'
                                }">
                                <i class="fa-solid fa-thumbtack ${isPinned ? 'rotate-45' : ''}"></i>
                            </button>
                        </div>

                        <div class="space-y-2 my-4 bg-slate-950/60 p-3 rounded-xl border border-white/5">
                            <div class="flex justify-between items-center text-xs">
                                <span class="text-slate-400">素体 (最低〜最高):</span>
                                <span class="font-bold text-slate-200">¥${card.rawMin.toLocaleString()} 〜 ¥${card.rawMax.toLocaleString()}</span>
                            </div>
                            <div class="flex justify-between items-center text-xs">
                                <span class="text-slate-400">PSA10 相場目安:</span>
                                <span class="font-bold text-brand-gold">¥${card.psa10Min.toLocaleString()} 〜 ¥${card.psa10Max.toLocaleString()}</span>
                            </div>
                            <div class="flex justify-between items-center text-[11px] pt-1.5 border-t border-slate-800">
                                <span class="text-slate-500">直近価格変動:</span>
                                <span class="font-bold ${card.isTrendUp ? 'text-emerald-400' : 'text-rose-400'}">
                                    <i class="fa-solid fa-arrow-trend-${card.isTrendUp ? 'up' : 'down'} mr-1"></i>${card.trend}
                                </span>
                            </div>
                        </div>

                        ${isPinned ? `
                            <div class="flex items-center justify-between bg-brand-gold/10 border border-brand-gold/30 rounded-xl px-3 py-1.5 mb-3">
                                <span class="text-xs font-bold text-brand-gold">所有枚数:</span>
                                <div class="flex items-center gap-3">
                                    <button onclick="updateQty('${card.id}', -1)" class="w-6 h-6 rounded-lg bg-slate-800 text-white flex items-center justify-center font-bold text-xs hover:bg-slate-700">-</button>
                                    <span class="font-extrabold text-white text-sm">${qty}</span>
                                    <button onclick="updateQty('${card.id}', 1)" class="w-6 h-6 rounded-lg bg-slate-800 text-white flex items-center justify-center font-bold text-xs hover:bg-slate-700">+</button>
                                </div>
                            </div>
                        ` : ''}
                    </div>

                    <div class="px-4 pb-4 pt-0">
                        <button onclick="openModal('${card.name}')" class="w-full py-2 bg-slate-900 hover:bg-slate-800 text-slate-300 hover:text-white rounded-xl text-xs font-semibold border border-brand-border transition flex items-center justify-center gap-2">
                            <i class="fa-solid fa-arrow-up-right-from-square text-brand-cyan"></i>
                            実売・最安相場を見る (アフィリ連携)
                        </button>
                    </div>
                `;

                grid.appendChild(cardEl);
            });
        }

        // アフィリエイトモーダル表示
        function openModal(cardName) {
            const modal = document.getElementById('shop-modal');
            const encoded = encodeURIComponent(cardName);

            document.getElementById('modal-card-name').textContent = cardName;

            const linksContainer = document.getElementById('modal-links');
            linksContainer.innerHTML = `
                <a href="https://jp.mercari.com/search?keyword=${encoded}&afid=${AFFILIATE_IDS.mercari}" target="_blank" 
                    class="flex items-center justify-between p-3 rounded-xl bg-slate-900 border border-brand-border hover:border-red-500/50 transition group">
                    <span class="text-sm font-semibold text-slate-200 group-hover:text-red-400">
                        <i class="fa-solid fa-store mr-2 text-red-500"></i>メルカリで最安出品を探す
                    </span>
                    <i class="fa-solid fa-chevron-right text-xs text-slate-500"></i>
                </a>
                <a href="https://hb.afl.rakuten.co.jp/hgc/${AFFILIATE_IDS.rakuten}/?pc=https%3A%2F%2Fsearch.rakuten.co.jp%2Fsearch%2Fmall%2F${encoded}%2F" target="_blank" 
                    class="flex items-center justify-between p-3 rounded-xl bg-slate-900 border border-brand-border hover:border-rose-500/50 transition group">
                    <span class="text-sm font-semibold text-slate-200 group-hover:text-rose-400">
                        <i class="fa-solid fa-bag-shopping mr-2 text-rose-500"></i>楽天市場の取扱ショップ一覧
                    </span>
                    <i class="fa-solid fa-chevron-right text-xs text-slate-500"></i>
                </a>
                <a href="https://www.suruga-ya.jp/search?search_word=${encoded}" target="_blank" 
                    class="flex items-center justify-between p-3 rounded-xl bg-slate-900 border border-brand-border hover:border-blue-500/50 transition group">
                    <span class="text-sm font-semibold text-slate-200 group-hover:text-blue-400">
                        <i class="fa-solid fa-box mr-2 text-blue-500"></i>駿河屋で買取・販売価格を比較
                    </span>
                    <i class="fa-solid fa-chevron-right text-xs text-slate-500"></i>
                </a>
                <a href="https://www.amazon.co.jp/s?k=${encoded}&tag=${AFFILIATE_IDS.amazon}" target="_blank" 
                    class="flex items-center justify-between p-3 rounded-xl bg-slate-900 border border-brand-border hover:border-amber-500/50 transition group">
                    <span class="text-sm font-semibold text-slate-200 group-hover:text-amber-400">
                        <i class="fa-brands fa-amazon mr-2 text-amber-500"></i>Amazonの在庫を確認
                    </span>
                    <i class="fa-solid fa-chevron-right text-xs text-slate-500"></i>
                </a>
            `;

            modal.classList.remove('hidden');
        }

        function closeModal() {
            document.getElementById('shop-modal').classList.add('hidden');
        }
    </script>
</body>
</html>
