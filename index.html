<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TCG Hub - レアリティ対応カード管理アプリ</title>
    <style>
        :root {
            --bg-color: #0f172a;
            --card-bg: #1e293b;
            --accent-color: #38bdf8;
            --text-main: #f8fafc;
            --text-sub: #94a3b8;
            --border-color: #334155;
            --rarity-sar: #f59e0b;
            --rarity-sr: #ec4899;
            --rarity-rr: #3b82f6;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Helvetica Neue', Arial, 'Hiragino Kaku Gothic ProN', sans-serif;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-main);
            padding: 20px;
            display: flex;
            justify-content: center;
        }

        .app-container {
            max-width: 1000px;
            width: 100%;
            display: grid;
            grid-template-columns: 1fr 340px;
            gap: 24px;
        }

        @media (max-width: 850px) {
            .app-container {
                grid-template-columns: 1fr;
            }
        }

        /* 資産サマリーヘッダー */
        .dashboard-header {
            grid-column: 1 / -1;
            background: linear-gradient(135deg, #1e293b, #0f172a);
            border: 1px solid var(--border-color);
            border-radius: 16px;
            padding: 20px 24px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.3);
        }

        .summary-title {
            font-size: 0.9rem;
            color: var(--text-sub);
            margin-bottom: 4px;
        }

        .summary-value {
            font-size: 2rem;
            font-weight: bold;
            color: var(--accent-color);
        }

        .summary-stats {
            display: flex;
            gap: 20px;
        }

        .stat-badge {
            background-color: rgba(255, 255, 255, 0.05);
            padding: 8px 14px;
            border-radius: 10px;
            font-size: 0.85rem;
        }

        .stat-badge span {
            display: block;
            font-weight: bold;
            color: var(--text-main);
        }

        /* メインビュー: カード詳細＆レアリティ選択 */
        .card-detail-card {
            background-color: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 16px;
            padding: 24px;
            display: flex;
            flex-direction: column;
            gap: 20px;
        }

        .card-header {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
        }

        .card-title {
            font-size: 1.5rem;
            font-weight: bold;
        }

        .game-tag {
            background-color: #334155;
            font-size: 0.75rem;
            padding: 4px 8px;
            border-radius: 6px;
            color: var(--text-sub);
        }

        /* カードイラスト表示領域 */
        .card-preview-area {
            display: flex;
            justify-content: center;
            align-items: center;
            background-color: rgba(0, 0, 0, 0.2);
            border-radius: 12px;
            padding: 20px;
            position: relative;
        }

        .card-image-display {
            width: 220px;
            height: 308px;
            border-radius: 10px;
            object-fit: cover;
            box-shadow: 0 8px 24px rgba(0, 0, 0, 0.5);
            transition: transform 0.2s ease, box-shadow 0.2s ease;
        }

        .card-image-display:hover {
            transform: translateY(-4px);
            box-shadow: 0 12px 32px rgba(56, 189, 248, 0.2);
        }

        /* レアリティ切り替えセクション */
        .section-title {
            font-size: 0.9rem;
            color: var(--text-sub);
            margin-bottom: 10px;
        }

        .rarity-selector {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 12px;
        }

        .rarity-card {
            background: rgba(255, 255, 255, 0.03);
            border: 2px solid var(--border-color);
            border-radius: 12px;
            padding: 10px;
            cursor: pointer;
            text-align: center;
            transition: all 0.2s ease;
        }

        .rarity-card:hover {
            border-color: var(--text-sub);
        }

        .rarity-card.active {
            border-color: var(--accent-color);
            background: rgba(56, 189, 248, 0.1);
        }

        .rarity-thumb {
            width: 100%;
            height: 70px;
            object-fit: cover;
            border-radius: 6px;
            margin-bottom: 6px;
        }

        .rarity-badge {
            font-size: 0.75rem;
            font-weight: bold;
            display: inline-block;
            padding: 2px 6px;
            border-radius: 4px;
            margin-bottom: 4px;
        }

        .badge-sar { background-color: rgba(245, 158, 11, 0.2); color: var(--rarity-sar); }
        .badge-sr { background-color: rgba(236, 72, 153, 0.2); color: var(--rarity-sr); }
        .badge-rr { background-color: rgba(59, 130, 246, 0.2); color: var(--rarity-rr); }

        .rarity-price {
            font-size: 0.85rem;
            font-weight: bold;
        }

        /* 価格・詳細スペック表示 */
        .price-info-box {
            background-color: rgba(0, 0, 0, 0.2);
            border-radius: 12px;
            padding: 16px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .current-price {
            font-size: 1.6rem;
            font-weight: bold;
            color: #4ade80;
        }

        .price-change {
            font-size: 0.85rem;
            color: #4ade80;
        }

        /* 右側サイドパネル: コレクション追加フォーム */
        .side-panel {
            background-color: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 16px;
            padding: 24px;
            display: flex;
            flex-direction: column;
            gap: 16px;
        }

        .form-group {
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .form-group label {
            font-size: 0.85rem;
            color: var(--text-sub);
        }

        .form-control {
            background-color: #0f172a;
            border: 1px solid var(--border-color);
            border-radius: 8px;
            padding: 10px 12px;
            color: var(--text-main);
            font-size: 0.95rem;
            outline: none;
        }

        .form-control:focus {
            border-color: var(--accent-color);
        }

        .condition-options {
            display: flex;
            gap: 8px;
        }

        .condition-btn {
            flex: 1;
            padding: 8px 4px;
            font-size: 0.75rem;
            border: 1px solid var(--border-color);
            border-radius: 8px;
            background: #0f172a;
            color: var(--text-sub);
            cursor: pointer;
            text-align: center;
        }

        .condition-btn.active {
            border-color: var(--accent-color);
            color: var(--text-main);
            background-color: rgba(56, 189, 248, 0.15);
        }

        .calculated-value-box {
            background-color: rgba(56, 189, 248, 0.05);
            border: 1px dashed var(--accent-color);
            border-radius: 10px;
            padding: 12px;
            text-align: center;
        }

        .btn-primary {
            background-color: var(--accent-color);
            color: #0f172a;
            font-weight: bold;
            padding: 14px;
            border: none;
            border-radius: 10px;
            cursor: pointer;
            font-size: 1rem;
            transition: opacity 0.2s;
        }

        .btn-primary:hover {
            opacity: 0.9;
        }
    </style>
</head>
<body>

<div class="app-container">

    <!-- 資産概要ダッシュボード -->
    <div class="dashboard-header">
        <div>
            <div class="summary-title">マイコレクション 総資産評価額</div>
            <div class="summary-value" id="totalAssetDisplay">¥142,500</div>
        </div>
        <div class="summary-stats">
            <div class="stat-badge">
                総所持枚数
                <span id="totalCountDisplay">14 枚</span>
            </div>
            <div class="stat-badge">
                含み損益
                <span style="color: #4ade80;">+¥28,400</span>
            </div>
        </div>
    </div>

    <!-- 左側：カード詳細＆レアリティ切り替え -->
    <div class="card-detail-card">
        <div class="card-header">
            <div>
                <div class="card-title" id="cardTitle">リザードンex</div>
                <div style="font-size: 0.85rem; color: var(--text-sub);" id="setCodeDisplay">型番: SV4a-349/190</div>
            </div>
            <span class="game-tag">ポケモンカード</span>
        </div>

        <!-- イラスト拡大エリア -->
        <div class="card-preview-area">
            <img id="mainCardImg" class="card-image-display" src="https://picsum.photos/seed/charizard-sar/400/560" alt="カードイラスト">
        </div>

        <!-- レアリティ選択（サムネイル付き） -->
        <div>
            <div class="section-title">レアリティ・バージョンを選択 (イラスト違い)</div>
            <div class="rarity-selector">
                <!-- SAR -->
                <div class="rarity-card active" onclick="selectRarity('SAR', 'SV4a-349/190', 32000, 'charizard-sar', this)">
                    <img class="rarity-thumb" src="https://picsum.photos/seed/charizard-sar/200/280" alt="SAR">
                    <span class="rarity-badge badge-sar">SAR</span>
                    <div class="rarity-price">¥32,000</div>
                </div>
                <!-- SR -->
                <div class="rarity-card" onclick="selectRarity('SR', 'SV4a-185/190', 8500, 'charizard-sr', this)">
                    <img class="rarity-thumb" src="https://picsum.photos/seed/charizard-sr/200/280" alt="SR">
                    <span class="rarity-badge badge-sr">SR</span>
                    <div class="rarity-price">¥8,500</div>
                </div>
                <!-- RR -->
                <div class="rarity-card" onclick="selectRarity('RR', 'SV4a-054/190', 480, 'charizard-rr', this)">
                    <img class="rarity-thumb" src="https://picsum.photos/seed/charizard-rr/200/280" alt="RR">
                    <span class="rarity-badge badge-rr">RR</span>
                    <div class="rarity-price">¥480</div>
                </div>
            </div>
        </div>

        <!-- 選択中の相場表示 -->
        <div class="price-info-box">
            <div>
                <div style="font-size: 0.8rem; color: var(--text-sub);">選択中レアリティの参考相場</div>
                <div class="current-price" id="marketPriceDisplay">¥32,000</div>
            </div>
            <div class="price-change">前日比 +5.2% ▲</div>
        </div>
    </div>

    <!-- 右側：マイコレクション追加フォーム -->
    <div class="side-panel">
        <div style="font-weight: bold; font-size: 1.1rem; border-bottom: 1px solid var(--border-color); padding-bottom: 10px;">
            コレクションに登録
        </div>

        <div class="form-group">
            <label>選択中のレアリティ</label>
            <input type="text" id="selectedVariantInput" class="form-control" value="SAR (SV4a-349/190)" readonly>
        </div>

        <!-- カードの状態選択 -->
        <div class="form-group">
            <label>カードの状態 (コンディション)</label>
            <div class="condition-options">
                <div class="condition-btn active" onclick="setCondition('NM', 1.0, this)">美品 (NM)<br>100%</div>
                <div class="condition-btn" onclick="setCondition('EX', 0.8, this)">微キズ (EX)<br>80%</div>
                <div class="condition-btn" onclick="setCondition('PL', 0.5, this)">プレイ用<br>50%</div>
            </div>
        </div>

        <!-- 購入価格 -->
        <div class="form-group">
            <label>購入価格 (任意)</label>
            <input type="number" id="purchasePriceInput" class="form-control" placeholder="例: 28000" value="28000">
        </div>

        <!-- 枚数 -->
        <div class="form-group">
            <label>所有枚数</label>
            <input type="number" id="quantityInput" class="form-control" value="1" min="1" onchange="calculateValue()">
        </div>

        <!-- 状態考慮後の計算結果 -->
        <div class="calculated-value-box">
            <div style="font-size: 0.8rem; color: var(--text-sub);">状態補正後の予想評価額</div>
            <div style="font-size: 1.3rem; font-weight: bold; color: var(--accent-color);" id="itemEstimatedValue">¥32,000</div>
        </div>

        <button class="btn-primary" onclick="addToCollection()">マイコレクションに追加</button>
    </div>

</div>

<script>
    // 現在の選択状態
    let currentMarketPrice = 32000;
    let currentConditionMultiplier = 1.0;
    let currentRarity = 'SAR';
    let currentSetCode = 'SV4a-349/190';

    // 全体集計デモ用変数
    let totalAsset = 142500;
    let totalCount = 14;

    // レアリティ切り替え時の処理
    function selectRarity(rarity, setCode, price, imgSeed, element) {
        currentRarity = rarity;
        currentSetCode = setCode;
        currentMarketPrice = price;

        // アクティブ表示の切り替え
        document.querySelectorAll('.rarity-card').forEach(el => el.classList.remove('active'));
        element.classList.add('active');

        // 表示の更新
        document.getElementById('setCodeDisplay').innerText = `型番: ${setCode}`;
        document.getElementById('marketPriceDisplay').innerText = `¥${price.toLocaleString()}`;
        document.getElementById('selectedVariantInput').value = `${rarity} (${setCode})`;
        
        // メイン画像の更新
        document.getElementById('mainCardImg').src = `https://picsum.photos/seed/${imgSeed}/400/560`;

        // 個別評価額の再計算
        calculateValue();
    }

    // 状態（コンディション）選択時の処理
    function setCondition(type, multiplier, element) {
        currentConditionMultiplier = multiplier;

        document.querySelectorAll('.condition-btn').forEach(el => el.classList.remove('active'));
        element.classList.add('active');

        calculateValue();
    }

    // 単品評価額のリアルタイム計算
    function calculateValue() {
        const qty = parseInt(document.getElementById('quantityInput').value) || 1;
        const estimatedValue = currentMarketPrice * currentConditionMultiplier * qty;
        document.getElementById('itemEstimatedValue').innerText = `¥${Math.round(estimatedValue).toLocaleString()}`;
    }

    // マイコレクションへの追加デモ
    function addToCollection() {
        const qty = parseInt(document.getElementById('quantityInput').value) || 1;
        const addedValue = currentMarketPrice * currentConditionMultiplier * qty;

        totalAsset += addedValue;
        totalCount += qty;

        document.getElementById('totalAssetDisplay').innerText = `¥${Math.round(totalAsset).toLocaleString()}`;
        document.getElementById('totalCountDisplay').innerText = `${totalCount} 枚`;

        alert(`「リザードンex (${currentRarity})」を ${qty}枚 コレクションに追加しました！`);
    }
</script>

</body>
</html>
